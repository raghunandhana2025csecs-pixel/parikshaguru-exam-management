services:
  # Spring Boot REST API Backend
  - type: web
    name: parikshaguru-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: parikshaguru-backend/parikshaguru-backend/Dockerfile
    dockerContext: parikshaguru-backend/parikshaguru-backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: aiven
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate # Production safer than 'update'
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ENABLED
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: parikshaguru-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Express Static Frontend Portal
  - type: web
    name: parikshaguru-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: ParikshaGuru Frontend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: parikshaguru-backend
          envVarKey: RENDER_EXTERNAL_URL
