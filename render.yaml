# Render Blueprint Configuration (render.yaml)
# ParikshaGuru - Spring Boot Backend (Docker) & Express Frontend
# Database: External Aiven MySQL (configured via environment variables)

services:
  # Spring Boot REST API Backend (Docker)
  - type: web
    name: parikshaguru-backend
    env: docker
    region: oregon
    plan: free
    rootDir: parikshaguru-backend/parikshaguru-backend
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: aiven
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: DB_URL
        sync: false # Set in Render dashboard (e.g. jdbc:mysql://host:port/dbname?useSSL=true&requireSSL=true)
      - key: DB_USER
        sync: false # Set in Render dashboard
      - key: DB_PASSWORD
        sync: false # Set in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ENABLED
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ORIGINS
        sync: false # Set to frontend Render URL after frontend deployment

  # Express Static Frontend Portal
  - type: web
    name: parikshaguru-frontend
    env: node
    region: oregon
    plan: free
    rootDir: ParikshaGuru Frontend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "3000"
      - key: API_BASE_URL
        sync: false # Set to backend Render URL (e.g. https://parikshaguru-backend.onrender.com)
