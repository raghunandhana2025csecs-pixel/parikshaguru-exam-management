# Aiven MySQL configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/parikshaguru_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      data-source-properties:
        # Aiven SSL/TLS configuration
        verifyServerCertificate: true
        useSSL: true
        requireSSL: true
        serverTimezone: UTC
        characterEncoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:ParikshaGuru-Dev-Only-Secret-Change-Me-Please-0123456789}
    expiration-minutes: 480
  seed:
    enabled: ${SEED_ENABLED:false}
    demoData: ${SEED_DEMO_DATA:false}

# CORS configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type
  allow-credentials: true
  max-age: 3600