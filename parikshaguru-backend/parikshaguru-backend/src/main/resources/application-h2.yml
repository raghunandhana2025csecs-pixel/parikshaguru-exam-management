# H2 in-memory profile for local testing only
spring:
  datasource:
    url: jdbc:h2:mem:parikshaguru_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: ${H2_USER:sa}
    password: ${H2_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:ParikshaGuru-Dev-Only-Secret-Change-Me-Please-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed:
    enabled: ${SEED_ENABLED:true}
    demoData: ${SEED_DEMO_DATA:true}
    adminName: ${SEED_ADMIN_NAME:Administrator}
    adminEmail: ${SEED_ADMIN_EMAIL:admin@test.local}
    adminPassword: ${SEED_ADMIN_PASSWORD:Admin@123}

# CORS for H2 testing
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type
  allow-credentials: true
  max-age: 3600
